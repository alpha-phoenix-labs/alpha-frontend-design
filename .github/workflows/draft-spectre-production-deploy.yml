name: Draft Spectre Production Deploy

on:
  push:
    branches:
      - draft/spectre-owner-login-live-20260927

permissions:
  contents: read

concurrency:
  group: draft-spectre-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_FACTORY_MODE: http
      VITE_FACTORY_API_BASE_URL: https://n8n-workflow-factory.onrender.com

    steps:
      - name: Checkout exact draft SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify frontend-only production configuration
        run: |
          test "$VITE_FACTORY_MODE" = "http"
          test "$VITE_FACTORY_API_BASE_URL" = "https://n8n-workflow-factory.onrender.com"

      - name: Typecheck
        run: npm run typecheck

      - name: Build exact draft SHA
        run: npm run build

      - name: Deploy draft Spectre build to control.vantarialabs.tech
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.141.0"
          command: deploy

      - name: Install production smoke browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install chromium

      - name: Verify OWNER gate on control.vantarialabs.tech
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            await page.goto('https://control.vantarialabs.tech', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.getByTestId('auth-login-button').waitFor({ state: 'visible', timeout: 20000 });
            console.log('CONTROL_OWNER_GATE_LIVE_PASS');
            await browser.close();
          })().catch((error) => {
            console.error('::error::' + (error?.message || String(error)));
            process.exit(1);
          });
          NODE
