name: Cloudflare Deploy Test

on:
  workflow_dispatch:
    inputs:
      g5_preview:
        description: "G5 Preview-Build mit realem Factory-HTTP-Modus (niemals Production-Traffic)"
        type: boolean
        default: false
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    env:
      VITE_FACTORY_MODE: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.g5_preview == true)) && 'http' || '' }}
      VITE_FACTORY_API_BASE_URL: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.g5_preview == true)) && 'https://n8n-workflow-factory.onrender.com' || '' }}

    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Verify checkout identity
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "DEPLOY_TEST_SHA=$(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify real-environment preview build configuration
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.g5_preview == true) }}
        run: |
          test "$VITE_FACTORY_MODE" = "http"
          test "$VITE_FACTORY_API_BASE_URL" = "https://n8n-workflow-factory.onrender.com"

      - name: Build
        run: npm run build

      - name: Upload version to Cloudflare (no traffic)
        id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.141.0"
          command: versions upload

      - name: Resolve isolated preview URL
        id: preview
        env:
          WRANGLER_OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          URL="$(printf '%s\n' "$WRANGLER_OUTPUT" | sed -n 's/.*Version Preview URL: \(https:\/\/[^ ]*\).*/\1/p' | tail -1)"
          test -n "$URL" || { echo "::error::Cloudflare preview URL missing"; exit 1; }
          case "$URL" in
            https://*-alpha-frontend-design.vantaria-labs.workers.dev) ;;
            *) echo "::error::Unexpected preview origin"; exit 1 ;;
          esac
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Install pinned browser runner
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install chromium

      - name: Verify Spectre OWNER login on isolated preview
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
        run: |
          test -n "$E2E_OWNER_EMAIL" || { echo "::error::E2E_OWNER_EMAIL secret missing"; exit 1; }
          test -n "$E2E_OWNER_PASSWORD" || { echo "::error::E2E_OWNER_PASSWORD secret missing"; exit 1; }
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext();
            const page = await context.newPage();
            await page.goto(process.env.PREVIEW_URL, { waitUntil: 'domcontentloaded', timeout: 30000 });
            const login = page.getByTestId('auth-login-button');
            await login.waitFor({ state: 'visible', timeout: 15000 });

            const popupPromise = context.waitForEvent('page', { timeout: 10000 });
            await login.click();
            const popup = await popupPromise;
            await popup.waitForLoadState('domcontentloaded', { timeout: 30000 });
            await popup.locator('input[name="email"]').fill(process.env.E2E_OWNER_EMAIL);
            await popup.locator('input[name="password"]').fill(process.env.E2E_OWNER_PASSWORD);
            await popup.locator('button[type="submit"]').click();

            const workspace = page.getByPlaceholder('Describe the workflow you want Craftflow to build');
            await workspace.waitFor({ state: 'visible', timeout: 20000 });
            console.log('SPECTRE_OWNER_LOGIN_PREVIEW_PASS');
            console.log('PREVIEW_URL=' + process.env.PREVIEW_URL);
            await browser.close();
          })().catch((error) => {
            console.error('::error::' + (error?.message || String(error)));
            process.exit(1);
          });
          NODE
