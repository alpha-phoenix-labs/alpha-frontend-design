name: Cloudflare Deploy Test

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Produktiv-Deploy ausführen (wirkt nur auf main, sonst nur versions upload)"
        type: boolean
        default: false
      g5_preview:
        description: "G5 Preview-Build mit realem Factory-HTTP-Modus (niemals Production-Traffic)"
        type: boolean
        default: false
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    env:
      VITE_FACTORY_MODE: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.g5_preview == true || inputs.deploy == true))) && 'http' || '' }}
      VITE_FACTORY_API_BASE_URL: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.g5_preview == true || inputs.deploy == true))) && 'https://n8n-workflow-factory.onrender.com' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Guard G5 preview from production routing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.g5_preview == true && inputs.deploy == true }}
        run: |
          echo "::error::G5 preview must never use production deploy."
          exit 1

      - name: Verify real-environment preview build configuration
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.g5_preview == true || inputs.deploy == true)) }}
        run: |
          test "$VITE_FACTORY_MODE" = "http"
          test "$VITE_FACTORY_API_BASE_URL" = "https://n8n-workflow-factory.onrender.com"

      - name: Build
        run: npm run build

      # Pull Requests, main pushes und jeder manuelle Start ohne deploy=true:
      # lädt eine Version ohne Live-Traffic hoch, kein Produktiv-Deploy.
      - name: Upload version to Cloudflare (no traffic)
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true) }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.141.0"
          command: versions upload

      # Produktiv-Deploy nur bei manuellem Start auf main mit deploy=true und niemals im G5-Preview-Modus.
      - name: Deploy to Cloudflare
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true && inputs.g5_preview != true }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.141.0"
          command: deploy
