name: Cloudflare Deploy Test

on:
  workflow_dispatch:
    inputs:
      g5_preview:
        description: "G5 Preview-Build mit realem Factory-HTTP-Modus (niemals Production-Traffic)"
        type: boolean
        default: false
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    env:
      VITE_FACTORY_MODE: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.g5_preview == true)) && 'http' || '' }}
      VITE_FACTORY_API_BASE_URL: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.g5_preview == true)) && 'https://api.vantarialabs.tech' || '' }}

    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Verify checkout identity
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "DEPLOY_TEST_SHA=$(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify real-environment preview build configuration
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.g5_preview == true) }}
        run: |
          test "$VITE_FACTORY_MODE" = "http"
          test "$VITE_FACTORY_API_BASE_URL" = "https://api.vantarialabs.tech"

      - name: Build
        run: npm run build

      - name: Upload version to Cloudflare (no traffic)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.141.0"
          command: versions upload
