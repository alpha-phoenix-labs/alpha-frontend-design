name: Temporary Production HTTP Allowlist E2E

on:
  push:
    branches:
      - test/http-allowlist-production-20260928

permissions:
  contents: read

concurrency:
  group: temporary-production-http-allowlist-e2e
  cancel-in-progress: true

jobs:
  http-allowlist-production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_PREVIEW_URL: https://control.vantarialabs.tech
      E2E_BACKEND_URL: https://api.vantarialabs.tech
      E2E_FRONTEND_SHA: 8ae0b3b05b503952ef68983ae1e043b52bac748c
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_BUSINESS_PROMPT: >-
        Create a minimal n8n workflow with exactly one manual trigger, then an HTTP Request node that performs GET https://postman-echo.com/get, then a Set node that stores ok=true. Do not omit or replace the HTTP Request. Use no credentials and no dynamic URLs.

    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v6

      - name: Verify production target
        run: |
          test "$E2E_PREVIEW_URL" = "https://control.vantarialabs.tech"
          test "$E2E_BACKEND_URL" = "https://api.vantarialabs.tech"

      - name: Require approved browser credentials
        run: |
          test -n "$E2E_OWNER_EMAIL" || { echo "::error::E2E_OWNER_EMAIL secret missing"; exit 1; }
          test -n "$E2E_OWNER_PASSWORD" || { echo "::error::E2E_OWNER_PASSWORD secret missing"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned browser runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install chromium

      - name: Run targeted production HTTP allowlist E2E
        run: node scripts/real-business-e2e.mjs
